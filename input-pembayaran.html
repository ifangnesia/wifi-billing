<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Pembayaran - Wi-Fi Billing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased flex h-screen overflow-hidden">

    <!-- Mobile Header & Hamburger -->
    <div class="md:hidden fixed w-full bg-white shadow-sm z-50 flex items-center justify-between p-4">
        <div class="text-lg font-bold text-purple-600">Wi-Fi Billing</div>
        <button id="menu-btn" class="text-gray-600 hover:text-gray-900 focus:outline-none">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="bg-white w-[250px] h-full border-r border-gray-200 flex flex-col absolute md:relative z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out pt-16 md:pt-0 shrink-0">
        <!-- Sidebar Header (Desktop) -->
        <div class="hidden md:flex items-center justify-center h-16 border-b border-gray-200 shrink-0">
            <img src="PURPLEIFANGNESIA.PNG" alt="Logo" class="h-8 w-auto">
        </div>

        <!-- Navigation -->
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:bg-gray-50 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-purple-600">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                </svg>
                <span>Dashboard</span>
            </a>
            <a href="kelola-pelanggan.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:bg-gray-50 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-purple-600">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
                </svg>
                <span>Kelola Pelanggan</span>
            </a>
            <a href="input-pembayaran.html" class="flex items-center gap-3 px-4 py-3 bg-purple-50 text-gray-900 font-bold rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-purple-600">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Z" />
                </svg>
                <span>Input Pembayaran</span>
            </a>
            <a href="tugas-isolir.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:bg-gray-50 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-purple-600">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3Z" />
                </svg>
                <span>Tugas Isolir</span>
            </a>
            <a href="riwayat-transaksi.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:bg-gray-50 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-purple-600">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                </svg>
                <span>Riwayat Transaksi</span>
            </a>
        </nav>
        <!-- Footer -->
        <div class="p-4 border-t border-gray-200 mt-auto shrink-0">
            <a href="login.html" class="block text-red-500 font-bold hover:text-red-700 cursor-pointer">KELUAR</a>
        </div>
    </aside>

    <!-- Overlay for mobile sidebar -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden pt-16 md:pt-0">
        
        <!-- Topbar / Header Atas -->
        <header class="bg-white shadow-sm px-8 py-5 shrink-0 z-10 relative flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold text-gray-800">Input Pembayaran</h2>
            </div>
            <button id="btn-tambah" class="bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-4 rounded-lg transition-colors shadow-sm flex items-center gap-2">
                <span>+</span> Input Pembayaran
            </button>
        </header>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto p-8">
            
            <!-- Tabel Tagihan -->
            <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-max">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-sm text-gray-600">
                                <th class="py-3 px-4 font-medium w-16">No</th>
                                <th class="py-3 px-4 font-medium">ID Client</th>
                                <th class="py-3 px-4 font-medium">Nama Pelanggan</th>
                                <th class="py-3 px-4 font-medium">Periode Tagihan</th>
                                <th class="py-3 px-4 font-medium text-left">Tagihan (Rp)</th>
                                <th class="py-3 px-4 font-medium">Status</th>
                                <th class="py-3 px-4 font-medium">Metode</th>
                                <th class="py-3 px-4 font-medium">Bukti</th>
                            </tr>
                        </thead>
                        <tbody class="text-sm text-gray-700">
                            <tr><td colspan="8" class="py-4 text-center text-sm text-gray-500 italic">Belum ada data tagihan</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Form Pembayaran -->
    <div id="modal-pembayaran" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-md mx-4">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-800">Input Pembayaran</h3>
                <button id="btn-tutup-modal" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <!-- Modal Body -->
            <div class="p-6">
                <form id="form-pembayaran" class="space-y-4">
                    <div>
                        <label for="input-nama" class="block text-sm font-medium text-gray-700 mb-1">Pilih Pelanggan</label>
                        <select id="input-nama" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                            <option value="" disabled selected>-- Pilih Pelanggan --</option>
                            <!-- Data pelanggan akan dirender secara dinamis lewat JavaScript -->
                        </select>
                    </div>
                    <div>
                        <label for="input-nominal" class="block text-sm font-medium text-gray-700 mb-1">Nominal Uang (Rp)</label>
                        <input type="number" id="input-nominal" class="w-full px-4 py-2 border border-gray-300 bg-gray-100 rounded-lg focus:outline-none cursor-not-allowed text-gray-600" required readonly>
                    </div>
                    <div>
                        <label for="input-metode" class="block text-sm font-medium text-gray-700 mb-1">Metode Pembayaran</label>
                        <select id="input-metode" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                            <option value="Cash">Cash</option>
                            <option value="Transfer">Transfer</option>
                        </select>
                    </div>
                    <div id="container-bukti" class="hidden">
                        <label for="input-bukti" class="block text-sm font-medium text-gray-700 mb-1">Upload Bukti Pembayaran</label>
                        <input type="file" id="input-bukti" accept="image/*" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100 cursor-pointer">
                    </div>
                </form>
            </div>
            
            <!-- Modal Footer -->
            <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3">
                <button type="button" id="btn-batal" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors focus:outline-none">
                    Batal
                </button>
                <button type="button" id="btn-simpan" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors focus:outline-none">
                    Simpan
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Penampil Gambar -->
    <div id="modal-gambar" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-lg mx-4 flex flex-col max-h-[90vh]">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center shrink-0">
                <h3 class="text-lg font-bold text-gray-800">Bukti Pembayaran</h3>
                <button id="btn-tutup-gambar" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 flex justify-center items-center">
                <img id="img-bukti" src="" alt="Bukti Transfer" class="max-w-full max-h-full object-contain">
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- JavaScript -->
    <script>
        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAzXiIDFpYYP56ynQjStCT4bV9IcGl4kXI",
            authDomain: "e-billingthom.firebaseapp.com",
            projectId: "e-billingthom",
            storageBucket: "e-billingthom.firebasestorage.app",
            messagingSenderId: "450682516112",
            appId: "1:450682516112:web:0c3f64868be3a6c7c76215"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Sidebar Toggle Mobile
        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        menuBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // Modal Logic
        const modal = document.getElementById('modal-pembayaran');
        const btnBatal = document.getElementById('btn-batal');
        const btnTutupModal = document.getElementById('btn-tutup-modal');
        const formPembayaran = document.getElementById('form-pembayaran');
        const btnTambah = document.getElementById('btn-tambah');
        
        const inputNama = document.getElementById('input-nama');
        const inputMetode = document.getElementById('input-metode');
        const containerBukti = document.getElementById('container-bukti');
        const inputNominal = document.getElementById('input-nominal');

        // Fungsi Buka Modal
        function bukaModal() {
            modal.classList.remove('hidden');
        }

        btnTambah.addEventListener('click', bukaModal);

        // Fungsi Tutup Modal
        function tutupModal() {
            modal.classList.add('hidden');
            formPembayaran.reset();
            cekMetodePembayaran(); // reset form visibility
        }

        btnBatal.addEventListener('click', tutupModal);
        btnTutupModal.addEventListener('click', tutupModal);

        // Menutup modal jika klik di luar area modal
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                tutupModal();
            }
        });

        // Logika Dinamis Metode Pembayaran
        function cekMetodePembayaran() {
            if (inputMetode.value === 'Transfer') {
                containerBukti.classList.remove('hidden');
            } else {
                containerBukti.classList.add('hidden');
            }
        }

        inputMetode.addEventListener('change', cekMetodePembayaran);
        
        // Inisialisasi awal saat halaman dimuat (pastikan sesuai default)
        cekMetodePembayaran();

        // Data array
        let dataPelanggan = [];
        let dataTransaksi = [];

        // Real-time listener Pelanggan
        db.collection('pelanggan').onSnapshot((snapshot) => {
            dataPelanggan = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                data.idDoc = doc.id;
                dataPelanggan.push(data);
            });
            // Update dropdown
            const currentValue = inputNama.value; // simpan nilai yg sedang dipilih
            inputNama.innerHTML = '<option value="" disabled selected>-- Pilih Pelanggan --</option>';
            dataPelanggan.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.idClient;
                opt.textContent = `${p.idClient} - ${p.nama}`;
                inputNama.appendChild(opt);
            });
            if (currentValue) inputNama.value = currentValue;
        });

        // Real-time listener Transaksi
        db.collection('transaksi').onSnapshot((snapshot) => {
            dataTransaksi = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                data.idDoc = doc.id;
                dataTransaksi.push(data);
            });
            // Sort by timestamp if possible, or we will just reverse later
            dataTransaksi.sort((a,b) => {
                // simple string compare of idTransaksi assuming they have Date.now()
                return a.idTransaksi.localeCompare(b.idTransaksi);
            });
            renderTabelPembayaran();
        });

        // Autofill Nominal when a customer is selected
        inputNama.addEventListener('change', function() {
            const selectedId = this.value;
            if (selectedId) {
                const client = dataPelanggan.find(p => p.idClient === selectedId);
                if (client) {
                    inputNominal.value = client.nominalPaket;
                }
            } else {
                inputNominal.value = ''; // Reset if default is selected
            }
        });

        // Submit Pembayaran
        const btnSimpan = document.getElementById('btn-simpan');
        const inputBukti = document.getElementById('input-bukti');

        btnSimpan.addEventListener('click', function(e) {
            e.preventDefault();
            
            const selectedId = inputNama.value;
            const nominal = inputNominal.value;
            const metode = inputMetode.value;

            if (!selectedId || !nominal) {
                alert('Pilih pelanggan terlebih dahulu!');
                return;
            }

            if (metode === 'Transfer' && inputBukti.files.length === 0) {
                alert('Silakan upload bukti pembayaran!');
                return;
            }

            const clientIndex = dataPelanggan.findIndex(p => p.idClient === selectedId);
            if (clientIndex === -1) return;

            const client = dataPelanggan[clientIndex];

            // Generate ID Transaksi
            const idTransaksi = 'TRX-' + Date.now();
            const todayDate = new Date();
            const tanggalTransaksi = todayDate.toISOString().split('T')[0]; // YYYY-MM-DD

            const prosesSimpan = (buktiBase64) => {
                // a. Simpan log ke dataTransaksi Firestore
                db.collection('transaksi').add({
                    idTransaksi: idTransaksi,
                    tanggalTransaksi: tanggalTransaksi,
                    idClient: client.idClient,
                    namaClient: client.nama,
                    odp: client.odp,
                    nominal: parseInt(nominal),
                    metode: metode,
                    bukti: buktiBase64,
                    status: 'Lunas'
                }).then(() => {
                    // b. Update Jatuh Tempo (tambah 1 bulan) pada Pelanggan
                    let jtDate = new Date(client.jatuhTempo);
                    jtDate.setMonth(jtDate.getMonth() + 1);
                    const newJt = jtDate.toISOString().split('T')[0];
                    
                    const jtDateOnly = new Date(newJt);
                    jtDateOnly.setHours(0,0,0,0);
                    const todayDateOnly = new Date();
                    todayDateOnly.setHours(0,0,0,0);
                    const newStatus = (todayDateOnly > jtDateOnly) ? "Isolir" : "Aktif";
    
                    return db.collection('pelanggan').doc(client.idDoc).update({
                        jatuhTempo: newJt,
                        status: newStatus,
                        isIsolir: false
                    });
                }).then(() => {
                    alert('Pembayaran berhasil dicatat!');
                    tutupModal();
                }).catch((error) => {
                    console.error("Error saving payment: ", error);
                    alert("Gagal memproses pembayaran");
                });
            };

            if (metode === 'Transfer') {
                const file = inputBukti.files[0];
                const reader = new FileReader();
                reader.onload = function(evt) {
                    prosesSimpan(evt.target.result);
                };
                reader.readAsDataURL(file);
            } else {
                prosesSimpan(null);
            }
        });

        // Helper untuk memformat angka jadi rupiah
        function formatRupiah(angka) {
            return 'Rp ' + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        // Helper untuk format bulan dan tahun (misal: "September 2026")
        function formatBulanIndo(dateString) {
            if (!dateString) return '';
            const dateObj = new Date(dateString);
            if (isNaN(dateObj.getTime())) return '';
            const formatter = new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' });
            return formatter.format(dateObj);
        }

        // Render Tabel Tagihan
        function renderTabelPembayaran() {
            const tbody = document.querySelector('tbody');
            tbody.innerHTML = '';
            
            if (dataTransaksi.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="py-4 text-center text-sm text-gray-500 italic">Belum ada data tagihan</td></tr>';
                return;
            }

            // Copy and reverse to show latest first
            const reversedData = [...dataTransaksi].reverse();

            reversedData.forEach((tx, index) => {
                let buktiHtml = '-';
                if (tx.metode === 'Transfer' && tx.bukti) {
                    buktiHtml = `<span class="text-blue-600 cursor-pointer hover:text-blue-800 font-bold underline" onclick="lihatBukti('${tx.idTransaksi}')">(bukti)</span>`;
                }

                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-100 hover:bg-gray-50 transition-colors';
                tr.innerHTML = `
                    <td class="py-3 px-4">${index + 1}</td>
                    <td class="py-3 px-4 font-medium text-purple-700">${tx.idClient}</td>
                    <td class="py-3 px-4 font-medium">${tx.namaClient}</td>
                    <td class="py-3 px-4">${formatBulanIndo(tx.tanggalTransaksi)}</td>
                    <td class="py-3 px-4 text-left font-medium">${formatRupiah(tx.nominal)}</td>
                    <td class="py-3 px-4">
                        <span class="px-2 py-1 text-xs font-medium rounded-full bg-green-100 text-green-700">Lunas</span>
                    </td>
                    <td class="py-3 px-4">${tx.metode}</td>
                    <td class="py-3 px-4">${buktiHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Logic for Image Modal
        const modalGambar = document.getElementById('modal-gambar');
        const imgBukti = document.getElementById('img-bukti');
        const btnTutupGambar = document.getElementById('btn-tutup-gambar');

        function lihatBukti(idTransaksi) {
            const tx = dataTransaksi.find(t => t.idTransaksi === idTransaksi);
            if (tx && tx.bukti) {
                imgBukti.src = tx.bukti;
                modalGambar.classList.remove('hidden');
            }
        }

        function tutupModalGambar() {
            modalGambar.classList.add('hidden');
            imgBukti.src = '';
        }

        btnTutupGambar.addEventListener('click', tutupModalGambar);
        modalGambar.addEventListener('click', function(e) {
            if (e.target === modalGambar) {
                tutupModalGambar();
            }
        });

        // Panggil render awal saat halaman dimuat
        renderTabelPembayaran();
        
    </script>
</body>
</html>
