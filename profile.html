    <!-- Sidebar -->

        <div class="hidden md:flex items-center justify-center h-16 border-b border-gray-200 shrink-0">

        <!-- Navigation -->

                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">

                </svg>
                <span>Tagihan</span>
            </a>
            <a href="riwayat-transaksi.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:bg-gray-50 rounded-lg transition-colors">

                </svg>
                <span>Riwayat Transaksi</span>
            </a>
            <a href="profile.html" class="flex items-center gap-3 px-4 py-3 bg-purple-50 text-purple-700 font-bold rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-purple-700">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
                </svg>
                <span>Profile (Paket)</span>
            </a>
            <a href="ticket.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:bg-gray-50 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 010 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 010-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375z" />
                </svg>
                <span>Ticket</span>
            </a>
        </nav>
        <!-- Footer -->
        <div class="p-4 border-t border-gray-200 mt-auto shrink-0">
            <a href="#" onclick="logout(event)" class="block text-red-500 font-bold hover:text-red-700 cursor-pointer">KELUAR</a>
        </div>
    </aside>

    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden pt-16 md:pt-0">
        
        <header class="bg-white shadow-sm px-4 md:px-8 py-5 shrink-0 z-10 relative flex justify-between items-center">
            <h2 class="text-xl font-bold text-gray-800">Manajemen Paket Langganan</h2>
            <button type="button" id="btnTambahProfile" class="px-4 py-2 bg-purple-600 text-white text-sm font-medium rounded-lg hover:bg-purple-700 transition-colors shadow-sm flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                New Profile
            </button>
        </header>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-50 space-y-6 pb-12">
            
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 border-b border-gray-100 text-xs text-gray-500 uppercase tracking-wider">
                            <tr>
                                <th class="py-4 px-6 font-semibold w-16">No</th>
                                <th class="py-4 px-6 font-semibold">Name (Paket)</th>
                                <th class="py-4 px-6 font-semibold">Price (Rp)</th>
                                <th class="py-4 px-6 font-semibold">Rate Limit / Keterangan</th>
                                <th class="py-4 px-6 font-semibold text-center w-28">Action</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-profiles" class="text-sm text-gray-700 divide-y divide-gray-50">
                            <tr><td colspan="5" class="py-12 text-center text-gray-500 italic">Memuat data paket...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Form Profile -->
    <div id="modal-profile" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-md mx-4">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-purple-50 rounded-t-xl">
                <h3 id="modal-title" class="text-lg font-bold text-gray-800">Tambah Paket</h3>
                <button id="btn-tutup-modal" class="text-gray-400 hover:text-gray-600 focus:outline-none bg-white p-1 rounded-full">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <div class="p-6">
                <form id="form-profile" class="space-y-4">
                    <input type="hidden" id="input-id">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Paket</label>
                        <input type="text" id="input-name" placeholder="Contoh: UPTO 5 Rp. 100.000" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Harga (Price)</label>
                        <input type="text" id="input-price" placeholder="Contoh: 155.000" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Rate Limit / Keterangan</label>
                        <input type="text" id="input-limit" placeholder="Contoh: 5M/5M" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                    </div>
                </form>
            </div>
            
            <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3 bg-gray-50 rounded-b-xl">
                <button type="button" id="btn-batal" class="px-5 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-100 transition-colors font-medium">Batal</button>
                <button type="button" id="btn-simpan" class="px-5 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors font-medium">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- JavaScript -->
    <script>
        // Auth Guard
        if (!localStorage.getItem('userRole') || !localStorage.getItem('username')) {
            window.location.replace('index.html');
        }
        const firebaseConfig = {
            apiKey: "AIzaSyAzXiIDFpYYP56ynQjStCT4bV9IcGl4kXI",
            authDomain: "e-billingthom.firebaseapp.com",
            projectId: "e-billingthom",
            storageBucket: "e-billingthom.firebasestorage.app",
            messagingSenderId: "450682516112",
            appId: "1:450682516112:web:0c3f64868be3a6c7c76215"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // RBAC check
        const userRole = localStorage.getItem('userRole');
        if (!userRole) {
            window.location.href = 'index.html';
        }
        if (userRole === 'sales') {
            alert('Akses Ditolak: Anda tidak memiliki wewenang untuk mengatur paket berlangganan.');
            window.location.href = 'dashboard.html';
        }

        // Format Rp
        const formatRupiah = (angka) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        };

        const tabelBody = document.getElementById('tabel-profiles');
        let dataProfiles = [];

        // Real-time Fetch
        db.collection('profiles').onSnapshot((snapshot) => {
            dataProfiles = [];
            snapshot.forEach(doc => {
                dataProfiles.push({ id: doc.id, ...doc.data() });
            });
            renderTable();
        });

        function renderTable() {
            if (dataProfiles.length === 0) {
                tabelBody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-gray-500 italic">Belum ada data paket.</td></tr>';
                return;
            }
            
            // Sort by price
            dataProfiles.sort((a,b) => (a.price || 0) - (b.price || 0));

            let html = '';
            dataProfiles.forEach((p, i) => {
                html += `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="py-4 px-6">${i + 1}</td>
                        <td class="py-4 px-6 font-medium text-gray-900">${p.name}</td>
                        <td class="py-4 px-6 font-semibold text-blue-600">${formatRupiah(p.price || 0)}</td>
                        <td class="py-4 px-6">${p.limit || '-'}</td>
                        <td class="py-4 px-6 text-center">
                            <div class="flex justify-center gap-2">
                                <button class="btn-edit p-1.5 text-blue-500 hover:bg-blue-50 rounded-lg transition-colors" data-id="${p.id}">
                                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                </button>
                                <button class="btn-delete p-1.5 text-red-500 hover:bg-red-50 rounded-lg transition-colors" data-id="${p.id}">
                                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tabelBody.innerHTML = html;
        }

        // Modal Logic
        const modal = document.getElementById('modal-profile');
        const form = document.getElementById('form-profile');
        const btnTambah = document.getElementById('btnTambahProfile');
        
        btnTambah.addEventListener('click', () => {
            document.getElementById('modal-title').textContent = 'Tambah Paket';
            form.reset();
            document.getElementById('input-id').value = '';
            modal.classList.remove('hidden');
        });

        const tutupModal = () => modal.classList.add('hidden');
        document.getElementById('btn-tutup-modal').addEventListener('click', tutupModal);
        document.getElementById('btn-batal').addEventListener('click', tutupModal);

        // Real-time formatter untuk input harga
        const inputPrice = document.getElementById('input-price');
        inputPrice.addEventListener('input', function(e) {
            let val = this.value.replace(/[^0-9]/g, '');
            if (val) {
                this.value = parseInt(val, 10).toLocaleString('id-ID');
            } else {
                this.value = '';
            }
        });

        document.getElementById('btn-simpan').addEventListener('click', async () => {
            const id = document.getElementById('input-id').value;
            const name = document.getElementById('input-name').value;
            const rawPrice = document.getElementById('input-price').value.replace(/[^0-9]/g, '');
            const price = parseInt(rawPrice, 10);
            const limit = document.getElementById('input-limit').value;

            if (!name || isNaN(price)) return alert('Nama dan Harga wajib diisi dengan benar!');

            const btn = document.getElementById('btn-simpan');
            btn.disabled = true; btn.textContent = 'Menyimpan...';

            try {
                if (id) {
                    await db.collection('profiles').doc(id).update({ name, price, limit });
                } else {
                    await db.collection('profiles').add({ name, price, limit });
                }
                tutupModal();
            } catch (err) {
                console.error(err);
                alert('Gagal menyimpan profil');
            } finally {
                btn.disabled = false; btn.textContent = 'Simpan';
            }
        });

        // Edit & Delete Event Delegation
        tabelBody.addEventListener('click', async (e) => {
            const btnEdit = e.target.closest('.btn-edit');
            if (btnEdit) {
                const id = btnEdit.getAttribute('data-id');
                const p = dataProfiles.find(x => x.id === id);
                if (p) {
                    document.getElementById('modal-title').textContent = 'Edit Paket';
                    document.getElementById('input-id').value = p.id;
                    document.getElementById('input-name').value = p.name;
                    document.getElementById('input-price').value = (p.price || 0).toLocaleString('id-ID');
                    document.getElementById('input-limit').value = p.limit || '';
                    modal.classList.remove('hidden');
                }
                return;
            }

            const btnDel = e.target.closest('.btn-delete');
            if (btnDel) {
                if (confirm('Yakin ingin menghapus paket ini?')) {
                    const id = btnDel.getAttribute('data-id');
                    await db.collection('profiles').doc(id).delete();
                }
            }
        });

        // Mobile Sidebar
        const btnMenu = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }
        btnMenu.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);
        
        function logout(e) {
            e.preventDefault();
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
