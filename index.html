<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Wi-Fi Billing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-8 border border-gray-100">
        <div class="text-center mb-8">
            <img src="PURPLEIFANGNESIA.PNG" alt="Logo" class="h-12 w-auto mx-auto mb-4">
            <p class="text-gray-500 mt-2 text-sm">Masuk untuk mengakses dashboard</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username Anda" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-colors" required>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password Anda" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-colors" required>
            </div>
            
            <div id="error-message" class="hidden text-red-600 text-sm font-medium bg-red-50 p-3 rounded-lg border border-red-100 text-center">
                Username atau password salah!
            </div>

            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                Login
            </button>
        </form>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script>
        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAzXiIDFpYYP56ynQjStCT4bV9IcGl4kXI",
            authDomain: "e-billingthom.firebaseapp.com",
            projectId: "e-billingthom",
            storageBucket: "e-billingthom.firebasestorage.app",
            messagingSenderId: "450682516112",
            appId: "1:450682516112:web:0c3f64868be3a6c7c76215"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Seeder Akun Wajib
        async function seedUsers() {
            const users = [
                { id: "adminsales", password: "salesadmin", area: "semua", role: "master" },
                { id: "masteradmin", password: "adminmaster", area: "semua", role: "master" },
                { id: "salesbin", password: "binsales", area: "BIN", role: "sales" },
                { id: "adminbros", password: "brosadmin", area: "BRS", role: "sales" },
                { id: "adminyanti", password: "yantiadmin", area: "YNT", role: "sales" }
            ];

            for (const u of users) {
                const docRef = db.collection('users').doc(u.id);
                docRef.get().then(docSnap => {
                    if (!docSnap.exists) {
                        docRef.set({
                            username: u.id,
                            password: u.password,
                            area: u.area,
                            role: u.role
                        }).then(() => console.log("Seeded user:", u.id));
                    }
                });
            }
        }
        
        // Panggil seeder saat halaman diload
        seedUsers();

        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            try {
                const userDocRef = db.collection('users').doc(username);
                const userSnap = await userDocRef.get();

                if (userSnap.exists) {
                    const userData = userSnap.data();
                    
                    if (userData.password === password) {
                        errorMessage.classList.add('hidden');
                        
                        // Simpan role dan area ke localStorage
                        localStorage.setItem('userRole', userData.role);
                        localStorage.setItem('userArea', userData.area);
                        localStorage.setItem('username', username);

                        window.location.href = 'dashboard.html';
                    } else {
                        errorMessage.textContent = 'Password salah!';
                        errorMessage.classList.remove('hidden');
                    }
                } else {
                    errorMessage.textContent = 'Username tidak ditemukan!';
                    errorMessage.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Error login:", error);
                errorMessage.textContent = 'Terjadi kesalahan sistem!';
                errorMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
