    <!-- Firebase SDK -->

    <!-- JavaScript -->
    <script>
        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAzXiIDFpYYP56ynQjStCT4bV9IcGl4kXI",
            authDomain: "e-billingthom.firebaseapp.com",
            projectId: "e-billingthom",
            storageBucket: "e-billingthom.firebasestorage.app",
            messagingSenderId: "450682516112",
            appId: "1:450682516112:web:0c3f64868be3a6c7c76215"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Sidebar Toggle Mobile
        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        menuBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        const FONNTE_TOKEN = "9cKNttPvb2Fhe8kC5KBR";

        // Fungsi Matikan Koneksi / Konfirmasi Isolir
        function matikanKoneksi(idDoc) {
            if (confirm("Konfirmasi: Apakah akses internet untuk klien ini sudah dimatikan di MikroTik?")) {
                db.collection('pelanggan').doc(idDoc).update({
                    isIsolir: true
                }).catch((error) => {
                    console.error("Error updating document: ", error);
                    alert("Gagal memperbarui status pelanggan");
                });
            }
        }

        function formatTanggalPendek(dateString) {
            if(!dateString) return '-';
            const date = new Date(dateString);
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            return date.toLocaleDateString('id-ID', options);
        }

        let dataPelanggan = [];
        let currentFilter = 'Semua';
        let searchQuery = '';

        function setFilterTagihan(status) {
            currentFilter = status;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.id === 'tab-' + status) {
                    btn.classList.add('bg-white', 'shadow-sm', 'text-gray-800');
                    btn.classList.remove('text-gray-500', 'hover:text-gray-700');
                } else {
                    btn.classList.remove('bg-white', 'shadow-sm', 'text-gray-800');
                    btn.classList.add('text-gray-500', 'hover:text-gray-700');
                }
            });
            renderTable();
        }

        document.getElementById('input-search').addEventListener('input', function(e) {
            searchQuery = e.target.value.toLowerCase();
            renderTable();
        });

        let pelangganQuery = db.collection('pelanggan');
        const roleQ = localStorage.getItem('userRole');
        const areaQ = localStorage.getItem('userArea');
        if (roleQ === 'sales' && areaQ) {
            pelangganQuery = pelangganQuery.where('area', '==', areaQ);
        }

        pelangganQuery.onSnapshot((snapshot) => {
            dataPelanggan = [];
            const today = new Date();
            today.setHours(0,0,0,0);

            snapshot.forEach((doc) => {
                const data = doc.data();
                if(data.isInactive) return; // Ignore inactive customers
                
                data.idDoc = doc.id;
                
                let diffDays = 0;
                if (data.jatuhTempo) {
                    const jtDate = new Date(data.jatuhTempo);
                    jtDate.setHours(0,0,0,0);
                    const diffTime = jtDate - today;
                    diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                }
                
                if (diffDays > 3) data.tagihanStatus = 'Lunas';
                else if (diffDays > 0 && diffDays <= 3) data.tagihanStatus = 'Belum Bayar';
                else data.tagihanStatus = 'Jatuh Tempo';

                dataPelanggan.push(data);
            });
            
            updateMetrics();
            renderTable();
        });

        function parseNominal(nomStr) {
            if (!nomStr) return 0;
            if (typeof nomStr === 'number') return nomStr;
            const str = String(nomStr).replace(/[^0-9]/g, '');
            return parseInt(str, 10) || 0;
        }

        function updateMetrics() {
            let total = 0, unpaid = 0, overdue = 0;
            dataPelanggan.forEach(p => {
                const nom = parseNominal(p.nominalPaket);
                total += nom; 
                if (p.tagihanStatus === 'Belum Bayar') unpaid += nom;
                if (p.tagihanStatus === 'Jatuh Tempo') overdue += nom;
            });
            
            const formatRp = (num) => 'Rp ' + num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            document.getElementById('metric-total').textContent = formatRp(total);
            document.getElementById('metric-unpaid').textContent = formatRp(unpaid);
            document.getElementById('metric-overdue').textContent = formatRp(overdue);
        }

        function renderTable() {
            const tbody = document.querySelector('tbody');
            
            let displayData = dataPelanggan;
            
            if (currentFilter !== 'Semua') {
                displayData = displayData.filter(p => p.tagihanStatus === currentFilter);
            }
            
            if (searchQuery) {
                displayData = displayData.filter(p => 
                    (p.nama && p.nama.toLowerCase().includes(searchQuery)) ||
                    (p.idClient && p.idClient.toLowerCase().includes(searchQuery))
                );
            }

            // Sort ascending by jatuh tempo (closest first)
            displayData.sort((a,b) => new Date(a.jatuhTempo) - new Date(b.jatuhTempo));

            tbody.innerHTML = '';
            
            if (displayData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-sm text-gray-500 italic">Tidak ada data tagihan yang sesuai</td></tr>';
                return;
            }

            displayData.forEach((p, index) => {
                const btnIsolirHtml = (p.isIsolir === true) 
                    ? `<button type="button" class="w-full text-left px-4 py-2 text-sm text-gray-400 cursor-not-allowed" disabled>Terisolir</button>`
                    : `<button type="button" class="btn-matikan-koneksi w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-red-600" data-iddoc="${p.idDoc}">Matikan Koneksi</button>`;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition-colors';
                tr.setAttribute('data-nomor', p.noWa || '');
                tr.setAttribute('data-nama', p.nama || '');
                tr.setAttribute('data-tempo', formatTanggalPendek(p.jatuhTempo) || '');
                
                // For invoice
                const dDate = new Date();
                const yy = String(dDate.getFullYear()).substring(2,4);
                const mm = String(dDate.getMonth() + 1).padStart(2, '0');
                const invNumber = `${p.idClient}/INV/${yy}${mm}`;
                const tglCetak = dDate.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                const noKontrak = `${p.idClient}/GMDP`;
                const totalTagihan = 'Rp ' + parseNominal(p.nominalPaket).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
                const formatter = new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' });
                const periodeTagihan = formatter.format(dDate);
                const namaPaket = p.paket ? "Biaya Langganan " + p.paket : "Biaya Koneksi Internet";

                tr.setAttribute('data-inv-client', p.idClient || '');
                tr.setAttribute('data-inv-no', invNumber);
                tr.setAttribute('data-inv-tglcetak', tglCetak);
                tr.setAttribute('data-inv-tgltempo', formatTanggalPendek(p.jatuhTempo) || '');
                tr.setAttribute('data-inv-kontrak', noKontrak);
                tr.setAttribute('data-inv-paket', namaPaket);
                tr.setAttribute('data-inv-periode', periodeTagihan);
                tr.setAttribute('data-inv-total', totalTagihan);

                let statusBadge = '';
                if (p.tagihanStatus === 'Lunas') statusBadge = '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-xs font-semibold">Lunas</span>';
                else if (p.tagihanStatus === 'Belum Bayar') statusBadge = '<span class="bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded text-xs font-semibold">Belum Bayar</span>';
                else statusBadge = '<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs font-semibold">Jatuh Tempo</span>';

                tr.innerHTML = `
                    <td class="py-4 px-6">${index + 1}</td>
                    <td class="py-4 px-6 font-bold text-purple-700">${p.idClient}</td>
                    <td class="py-4 px-6 font-medium text-gray-900">${p.nama}</td>
                    <td class="py-4 px-6">ODP ${p.odp}</td>
                    <td class="py-4 px-6">
                        <div class="mb-1">${statusBadge}</div>
                        <div class="text-xs text-gray-500 font-medium">${formatTanggalPendek(p.jatuhTempo)}</div>
                    </td>
                    <td class="py-4 px-6 text-center">
                        <div class="relative inline-block text-left">
                            <button type="button" class="btn-dropdown-toggle text-gray-400 hover:text-gray-600 focus:outline-none p-1.5 rounded-md hover:bg-gray-100 transition-colors" data-id="${p.idClient}">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 pointer-events-none" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z" />
                                </svg>
                            </button>
                            <div id="dropdown-${p.idClient}" class="aksi-dropdown hidden absolute right-0 mt-1 w-40 bg-white rounded-lg shadow-lg z-50 border border-gray-100 ring-1 ring-black ring-opacity-5 py-1">
                                <button type="button" class="btn-input-pembayaran w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-blue-600">Input Pembayaran</button>
                                <button type="button" class="btn-kirim-wa w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-green-600">Kirim WA</button>
                                ${btnIsolirHtml}
                                <button type="button" class="btn-cetak-invoice w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-purple-600">Cetak Invoice</button>
                            </div>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Event Delegation untuk Dropdown & Aksi
        document.querySelector('tbody').addEventListener('click', async function(e) {
            // Dropdown Toggle
            const toggleBtn = e.target.closest('.btn-dropdown-toggle');
            if (toggleBtn) {
                const idClient = toggleBtn.getAttribute('data-id');
                const dropdown = document.getElementById('dropdown-' + idClient);
                
                // Tutup semua dropdown lain
                document.querySelectorAll('.aksi-dropdown').forEach(d => {
                    if (d.id !== 'dropdown-' + idClient) d.classList.add('hidden');
                });
                
                dropdown.classList.toggle('hidden');
                return;
            }
            // Input Pembayaran
            const btnInputBayar = e.target.closest('.btn-input-pembayaran');
            if (btnInputBayar) {
                btnInputBayar.closest('.aksi-dropdown').classList.add('hidden');
                const row = btnInputBayar.closest('tr');
                const idClient = row.getAttribute('data-inv-client');
                
                const client = dataPelanggan.find(p => p.idClient === idClient);
                if (client) {
                    document.getElementById('input-iddoc').value = client.idDoc;
                    document.getElementById('input-idclient').value = client.idClient;
                    document.getElementById('input-odp').value = client.odp || '';
                    document.getElementById('input-nama').value = client.nama;
                    document.getElementById('input-area').value = client.area || '';
                    document.getElementById('input-nominal').value = parseNominal(client.nominalPaket);
                    
                    document.getElementById('modal-pembayaran').classList.remove('hidden');
                }
                return;
            }

            // Kirim WA
            const btnWA = e.target.closest('.btn-kirim-wa');
            if (btnWA) {
                btnWA.closest('.aksi-dropdown').classList.add('hidden');
                const row = btnWA.closest('tr');
                const nomorWa = row.getAttribute('data-nomor');
                const namaPelanggan = row.getAttribute('data-nama');
                const tanggalJatuhTempo = row.getAttribute('data-tempo');

                if (!nomorWa) return alert('Nomor WhatsApp pelanggan tidak valid atau kosong!');

                let formattedNumber = nomorWa.trim();
                if (formattedNumber.startsWith('0')) formattedNumber = '62' + formattedNumber.slice(1);

                const pesanWa = `Halo Kak *${namaPelanggan}*, \n\nIni adalah pengingat bahwa tagihan internet Anda akan jatuh tempo pada tanggal *${tanggalJatuhTempo}*. Mohon segera melakukan pembayaran ya kak. Terima kasih!`;

                const originalText = btnWA.innerHTML;
                btnWA.disabled = true;
                btnWA.innerHTML = '⏳ Mengirim...';

                try {
                    const response = await fetch('https://api.fonnte.com/send', {
                        method: 'POST',
                        headers: { 'Authorization': FONNTE_TOKEN, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ target: formattedNumber, message: pesanWa, countryCode: '62' })
                    });
                    const result = await response.json();
                    if (result.status) alert(`Notifikasi untuk ${namaPelanggan} berhasil dikirim!`);
                    else alert('Gagal mengirim pesan: ' + (result.reason || 'Kesalahan server Fonnte.'));
                } catch (err) {
                    console.error('Fonnte Error:', err);
                    alert('Gagal terhubung ke jaringan Fonnte.');
                } finally {
                    btnWA.disabled = false;
                    btnWA.innerHTML = originalText;
                }
                return;
            }
            
            // Matikan Koneksi
            const btnMatikan = e.target.closest('.btn-matikan-koneksi');
            if (btnMatikan) {
                btnMatikan.closest('.aksi-dropdown').classList.add('hidden');
                const idDoc = btnMatikan.getAttribute('data-iddoc');
                matikanKoneksi(idDoc);
                return;
            }

            // Cetak Invoice
            const btnCetak = e.target.closest('.btn-cetak-invoice');
            if (btnCetak) {
                btnCetak.closest('.aksi-dropdown').classList.add('hidden');
                const row = btnCetak.closest('tr');
                
                const params = new URLSearchParams({
                    status: 'tagihan',
                    idClient: row.getAttribute('data-inv-client'),
                    invNumber: row.getAttribute('data-inv-no'),
                    tglCetak: row.getAttribute('data-inv-tglcetak'),
                    tglTempo: row.getAttribute('data-inv-tgltempo'),
                    noKontrak: row.getAttribute('data-inv-kontrak'),
                    nama: row.getAttribute('data-nama'),
                    paket: row.getAttribute('data-inv-paket'),
                    periode: row.getAttribute('data-inv-periode'),
                    total: row.getAttribute('data-inv-total')
                });
                
                window.open('invoice.html?' + params.toString(), '_blank');
                return;
            }
        });

        // Tutup dropdown bila klik di luar
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.relative.inline-block')) {
                document.querySelectorAll('.aksi-dropdown').forEach(d => d.classList.add('hidden'));
            }
        });

        // Modal Input Pembayaran Logic
        const modalPembayaran = document.getElementById('modal-pembayaran');
        const btnBatal = document.getElementById('btn-batal');
        const btnTutupModal = document.getElementById('btn-tutup-modal');
        const formPembayaran = document.getElementById('form-pembayaran');
        const inputMetode = document.getElementById('input-metode');
        const containerBukti = document.getElementById('container-bukti');
        const btnSimpan = document.getElementById('btn-simpan');

        function tutupModal() {
            modalPembayaran.classList.add('hidden');
            formPembayaran.reset();
            containerBukti.classList.add('hidden');
        }
        btnBatal.addEventListener('click', tutupModal);
        btnTutupModal.addEventListener('click', tutupModal);
        
        inputMetode.addEventListener('change', function() {
            if (this.value === 'Transfer') containerBukti.classList.remove('hidden');
            else containerBukti.classList.add('hidden');
        });

        btnSimpan.addEventListener('click', function(e) {
            e.preventDefault();
            
            const idDoc = document.getElementById('input-iddoc').value;
            const idClient = document.getElementById('input-idclient').value;
            const nama = document.getElementById('input-nama').value;
            const odp = document.getElementById('input-odp').value;
            const area = document.getElementById('input-area').value;
            const nominal = document.getElementById('input-nominal').value;
            const metode = document.getElementById('input-metode').value;
            const inputBukti = document.getElementById('input-bukti');

            if (!idDoc || !nominal) return alert('Data pelanggan tidak valid!');
            if (metode === 'Transfer' && inputBukti.files.length === 0) return alert('Silakan upload bukti pembayaran!');

            const timestamp = Date.now();
            const idTransaksi = 'TRX-' + timestamp;
            const tanggalTransaksi = new Date(timestamp).toISOString().split('T')[0];
            const adminName = localStorage.getItem('username') || 'Unknown';

            btnSimpan.disabled = true;
            btnSimpan.textContent = "Menyimpan...";

            const clientData = dataPelanggan.find(p => p.idDoc === idDoc);
            
            const prosesSimpan = (buktiBase64) => {
                db.collection('transaksi').add({
                    idTransaksi: idTransaksi,
                    tanggalTransaksi: tanggalTransaksi,
                    timestamp: timestamp,
                    idClient: idClient,
                    namaClient: nama,
                    odp: odp,
                    nominal: parseInt(nominal),
                    metode: metode,
                    bukti: buktiBase64,
                    status: 'Lunas',
                    area: area,
                    admin: adminName
                }).then(() => {
                    // Update Jatuh Tempo (+1 bulan)
                    let jtDate = new Date(clientData.jatuhTempo || Date.now());
                    jtDate.setMonth(jtDate.getMonth() + 1);
                    const newJt = jtDate.toISOString().split('T')[0];
                    
                    const jtDateOnly = new Date(newJt);
                    jtDateOnly.setHours(0,0,0,0);
                    const todayDateOnly = new Date();
                    todayDateOnly.setHours(0,0,0,0);
                    const newStatus = (todayDateOnly > jtDateOnly) ? "Isolir" : "Aktif";
    
                    return db.collection('pelanggan').doc(idDoc).update({
                        jatuhTempo: newJt,
                        status: newStatus,
                        isIsolir: false
                    });
                }).then(() => {
                    btnSimpan.disabled = false;
                    btnSimpan.textContent = "Simpan";
                    tutupModal();
                    alert('Pembayaran berhasil dicatat!');
                }).catch((error) => {
                    console.error("Error: ", error);
                    btnSimpan.disabled = false;
                    btnSimpan.textContent = "Simpan";
                    alert("Gagal memproses pembayaran");
                });
            };

            if (metode === 'Transfer') {
                const file = inputBukti.files[0];
                const reader = new FileReader();
                reader.onload = function(e) { prosesSimpan(e.target.result); };
                reader.readAsDataURL(file);
            } else {
                prosesSimpan('');
            }
        });
        
        function logout(e) {
            e.preventDefault();
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
