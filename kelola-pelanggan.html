                </svg>

    <!-- Overlay for mobile sidebar -->

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden pt-16 md:pt-0">
        
        <!-- Topbar / Header Atas -->
        <header class="bg-white shadow-sm px-8 py-5 shrink-0 z-10 relative flex justify-between items-center">
            <div class="flex items-center gap-4">
                <h2 class="text-xl font-bold text-gray-800">Kelola Pelanggan</h2>
                <!-- Tombol Hapus Masal, ditambahkan class hidden secara default -->
                <button id="btn-hapus-masal" class="hidden bg-red-500 hover:bg-red-600 text-white font-medium py-1.5 px-3 rounded-lg transition-colors shadow-sm text-sm">
                    Hapus Terpilih
                </button>
            </div>
            <button id="btn-tambah" class="bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-4 rounded-lg transition-colors shadow-sm flex items-center gap-2">
                <span>+</span> Tambah Pelanggan Baru
            </button>
        </header>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto p-8">
            
            <!-- Tabel Kelola Pelanggan -->
            <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-max">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-sm text-gray-600">
                                <th class="py-3 px-4 font-medium w-12 text-center">
                                    <input type="checkbox" id="checkbox-all" class="rounded border-gray-300 text-purple-600 focus:ring-purple-500 w-4 h-4 cursor-pointer">
                                </th>
                                <th class="py-3 px-4 font-medium w-16">No</th>
                                <th class="py-3 px-4 font-medium">ID Client</th>
                                <th class="py-3 px-4 font-medium">Nama</th>
                                <th class="py-3 px-4 font-medium">Nomor WA</th>
                                <th class="py-3 px-4 font-medium">Lokasi</th>
                                <th class="py-3 px-4 font-medium">ODP</th>
                                <th class="py-3 px-4 font-medium">Paket</th>
                                <th class="py-3 px-4 font-medium">Tanggal Jatuh Tempo</th>
                                <th class="py-3 px-4 font-medium">Status</th>
                                <th class="py-3 px-4 font-medium">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-pelanggan" class="text-sm text-gray-700">
                            <tr><td colspan="11" class="py-4 text-center text-sm text-gray-500 italic">Belum ada data pelanggan</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Form Tambah Pelanggan -->
    <div id="modal-tambah" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-lg mx-4">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-bold text-gray-800">Tambah Pelanggan Baru</h3>
                <button id="btn-tutup-atas" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <!-- Modal Body -->
            <div class="p-6">
                <form id="form-tambah" class="space-y-4">
                    <input type="hidden" id="editIdClient" value="">
                    <div>
                        <label for="input-nama" class="block text-sm font-medium text-gray-700 mb-1">Nama Pelanggan</label>
                        <input type="text" id="input-nama" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                    </div>
                    <div>
                        <label for="input-wa" class="block text-sm font-medium text-gray-700 mb-1">Nomor WA</label>
                        <input type="tel" inputmode="numeric" id="input-wa" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                    </div>
                    <div>
                        <label for="alamatPelanggan" class="block text-sm font-medium text-gray-700 mb-1">Lokasi Pelanggan</label>
                        <input type="text" id="alamatPelanggan" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                    </div>
                    <div>
                        <label for="input-odp" class="block text-sm font-medium text-gray-700 mb-1">ODP</label>
                        <input type="number" id="input-odp" min="1" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                    </div>
                    <div>
                        <label for="input-paket" class="block text-sm font-medium text-gray-700 mb-1">Paket Langganan</label>
                        <select id="input-paket" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                            <option value="5Mbps 155.000">5Mbps 155.000</option>
                            <option value="10Mbps 255.000">10Mbps 255.000</option>
                            <option value="20Mbps 355.000">20Mbps 355.000</option>
                        </select>
                    </div>
                    <div>
                        <label for="input-jatuh-tempo" class="block text-sm font-medium text-gray-700 mb-1">Tanggal Jatuh Tempo</label>
                        <input type="date" id="input-jatuh-tempo" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                    </div>
                </form>
            </div>
            
            <!-- Modal Footer -->
            <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3">
                <button type="button" id="btn-batal" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">
                    Batal
                </button>
                <button type="button" id="btn-simpan" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors">
                    Simpan
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- JavaScript -->
    <script>
        // Sidebar Toggle Mobile
        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        menuBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // Modal Logic
        const modal = document.getElementById('modal-tambah');
        const btnTambah = document.getElementById('btn-tambah');
        const btnBatal = document.getElementById('btn-batal');
        const btnTutupAtas = document.getElementById('btn-tutup-atas');
        const btnSimpan = document.getElementById('btn-simpan');
        const btnHapusMasal = document.getElementById('btn-hapus-masal');
        const formTambah = document.getElementById('form-tambah');
        const tabelPelanggan = document.getElementById('tabel-pelanggan');

        function openModal() {
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
            formTambah.reset();
            document.getElementById('editIdClient').value = '';
            document.getElementById('modalTitle').textContent = 'Tambah Pelanggan Baru';
        }

        btnTambah.addEventListener('click', openModal);
        btnBatal.addEventListener('click', closeModal);
        btnTutupAtas.addEventListener('click', closeModal);

        // Menutup modal jika klik di area background gelap
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAzXiIDFpYYP56ynQjStCT4bV9IcGl4kXI",
            authDomain: "e-billingthom.firebaseapp.com",
            projectId: "e-billingthom",
            storageBucket: "e-billingthom.firebasestorage.app",
            messagingSenderId: "450682516112",
            appId: "1:450682516112:web:0c3f64868be3a6c7c76215"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Store customer data
        let pelangganData = [];

        // Ambil data pelanggan secara real-time dari Firestore
        db.collection('pelanggan').onSnapshot((snapshot) => {
            pelangganData = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                data.idDoc = doc.id; // Menyimpan ID dokumen Firestore
                pelangganData.push(data);
            });
            // Urutkan data berdasarkan ID Client atau nama jika diperlukan (opsional)
            pelangganData.sort((a, b) => (a.idClient > b.idClient) ? 1 : -1);
            renderTable();
        });

        // Format Date to Display (e.g., 15 Sept 2026)
        function formatTanggal(dateString) {
            const date = new Date(dateString);
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return date.toLocaleDateString('id-ID', options);
        }

        // Fungsi mengatur visibilitas tombol hapus masal
        function toggleDeleteBtn() {
            const checkedBoxes = document.querySelectorAll('.checkbox-item:checked');
            if (checkedBoxes.length > 0) {
                btnHapusMasal.classList.remove('hidden');
            } else {
                btnHapusMasal.classList.add('hidden');
            }
        }

        function bukaModalEdit(idClient) {
            const pelanggan = pelangganData.find(p => p.idClient === idClient);
            if (pelanggan) {
                document.getElementById('editIdClient').value = pelanggan.idClient;
                document.getElementById('input-nama').value = pelanggan.nama;
                document.getElementById('input-wa').value = pelanggan.noWa;
                document.getElementById('alamatPelanggan').value = pelanggan.alamat || '';
                document.getElementById('input-odp').value = pelanggan.odp;
                document.getElementById('input-paket').value = pelanggan.paket;
                document.getElementById('input-jatuh-tempo').value = pelanggan.jatuhTempo;
                
                document.getElementById('modalTitle').textContent = 'Edit Data Pelanggan';
                openModal();
            }
        }

        // Render Table Function
        function renderTable() {
            const checkboxAll = document.getElementById('checkbox-all');
            checkboxAll.checked = false; // reset check all on render

            if (pelangganData.length === 0) {
                tabelPelanggan.innerHTML = '<tr><td colspan="11" class="py-4 text-center text-sm text-gray-500 italic">Belum ada data pelanggan</td></tr>';
                toggleDeleteBtn(); // panggil pengecekan awal (akan hide karena 0 checkbox)
                return;
            }

            tabelPelanggan.innerHTML = '';
            
            pelangganData.forEach((p, index) => {
                let teksAlamat = (p.alamat && p.alamat.length > 25) ? p.alamat.substring(0, 25) + '...' : (p.alamat || '-');

                const statusHtml = (p.isIsolir === true)
                    ? `<span class="bg-red-100 text-red-700 px-2 py-1 rounded font-bold text-xs">Isolir</span>`
                    : `<span class="bg-green-100 text-green-700 px-2 py-1 rounded font-bold text-xs">Aktif</span>`;

                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-100 hover:bg-gray-50 transition-colors';
                tr.innerHTML = `
                    <td class="py-3 px-4 text-center">
                        <input type="checkbox" class="checkbox-item rounded border-gray-300 text-purple-600 focus:ring-purple-500 w-4 h-4 cursor-pointer" data-index="${index}">
                    </td>
                    <td class="py-3 px-4">${index + 1}</td>
                    <td class="py-3 px-4 font-medium text-purple-700">${p.idClient}</td>
                    <td class="py-3 px-4 font-medium">${p.nama}</td>
                    <td class="py-3 px-4">${p.noWa}</td>
                    <td title="${p.alamat || ''}" class="py-3 px-4 whitespace-nowrap">${teksAlamat}</td>
                    <td class="py-3 px-4 font-medium">ODP ${p.odp}</td>
                    <td class="py-3 px-4">${p.paket}</td>
                    <td class="py-3 px-4">${formatTanggal(p.jatuhTempo)}</td>
                    <td class="py-3 px-4">
                        ${statusHtml}
                    </td>
                    <td class="py-3 px-4 space-x-2">
                        <span class="text-blue-600 cursor-pointer hover:underline font-bold" onclick="bukaModalEdit('${p.idClient}')">Edit</span>
                        <button class="text-red-600 hover:text-red-800 font-medium" onclick="hapusPelanggan(${index})">Hapus</button>
                    </td>
                `;
                tabelPelanggan.appendChild(tr);
            });

            // Update Checkbox All status based on individual checkboxes
            const checkboxes = document.querySelectorAll('.checkbox-item');
            checkboxes.forEach(cb => {
                cb.addEventListener('change', function() {
                    const allChecked = document.querySelectorAll('.checkbox-item:checked').length === checkboxes.length;
                    checkboxAll.checked = allChecked;
                    toggleDeleteBtn(); // panggil saat individual checkbox berubah
                });
            });

            toggleDeleteBtn(); // panggil untuk memastikan status yang sesuai
        }

        // Action: Simpan Data Baru / Edit Data
        btnSimpan.addEventListener('click', function(e) {
            e.preventDefault();
            
            const editIdClient = document.getElementById('editIdClient').value;
            const nama = document.getElementById('input-nama').value;
            const wa = document.getElementById('input-wa').value;
            const alamat = document.getElementById('alamatPelanggan').value;
            const odp = document.getElementById('input-odp').value;
            const paket = document.getElementById('input-paket').value;
            const jatuhTempo = document.getElementById('input-jatuh-tempo').value;
            
            if (!nama || !wa || !odp || !paket || !jatuhTempo || !alamat) {
                alert('Harap lengkapi semua data form!');
                return;
            }

            // Hitung status berdasarkan tanggal jatuh tempo
            const today = new Date();
            today.setHours(0, 0, 0, 0); 
            const jatuhTempoDate = new Date(jatuhTempo);
            jatuhTempoDate.setHours(0, 0, 0, 0);
            
            let status = "Aktif";
            if (today > jatuhTempoDate) {
                status = "Isolir";
            }

            // Extract nominal from paket string (e.g. "5Mbps 155.000")
            const nominalPaket = parseInt(paket.split(' ')[1].replace('.', ''));

            if (editIdClient) {
                // EDIT DATA
                const pelanggan = pelangganData.find(p => p.idClient === editIdClient);
                if (pelanggan && pelanggan.idDoc) {
                    db.collection('pelanggan').doc(pelanggan.idDoc).update({
                        nama: nama,
                        noWa: wa,
                        alamat: alamat,
                        odp: odp,
                        paket: paket,
                        nominalPaket: nominalPaket,
                        jatuhTempo: jatuhTempo,
                        status: status
                    }).then(() => {
                        closeModal();
                    }).catch((error) => {
                        console.error("Error updating document: ", error);
                        alert("Gagal mengupdate data");
                    });
                }
            } else {
                // TAMBAH DATA BARU
                // Generate ID Client
                // jatuhTempo format is "YYYY-MM-DD" from input type="date"
                const parts = jatuhTempo.split('-');
                const yy = parts[0].substring(2);
                const mm = parts[1];
                const dd = parts[2];

                const odpPadded = odp.toString().padStart(2, '0');
                
                // Hitung nomor urut (jumlah pelanggan dengan odp yang sama saat ini)
                const countSameOdp = pelangganData.filter(p => p.odp === odp).length;
                const sequence = (countSameOdp + 1).toString().padStart(2, '0');

                const idClient = `${yy}${mm}${dd}${odpPadded}${sequence}`;

                // Add to array
                db.collection('pelanggan').add({
                    idClient: idClient,
                    nama: nama,
                    noWa: wa,
                    alamat: alamat,
                    odp: odp,
                    paket: paket,
                    nominalPaket: nominalPaket,
                    jatuhTempo: jatuhTempo,
                    status: status
                }).then(() => {
                    closeModal();
                }).catch((error) => {
                    console.error("Error adding document: ", error);
                    alert("Gagal menambah data");
                });
            }
        });

        function hapusPelanggan(index) {
            if(confirm("Apakah yakin akan menghapus ini?")) {
                const idDoc = pelangganData[index].idDoc;
                db.collection('pelanggan').doc(idDoc).delete().catch((error) => {
                    console.error("Error removing document: ", error);
                    alert("Gagal menghapus data");
                });
            }
        }

        // Action: Select All Checkbox
        const checkboxAll = document.getElementById('checkbox-all');
        checkboxAll.addEventListener('change', function() {
            const checkboxes = document.querySelectorAll('.checkbox-item');
            checkboxes.forEach(cb => {
                cb.checked = checkboxAll.checked;
            });
            toggleDeleteBtn(); // panggil saat select all digunakan
        });

        // Action: Hapus Data Masal (Bulk Delete)
        btnHapusMasal.addEventListener('click', function() {
            const checkedBoxes = document.querySelectorAll('.checkbox-item:checked');
            if (checkedBoxes.length === 0) {
                alert("Silakan centang data pelanggan yang ingin dihapus.");
                return;
            }

            if(confirm("Apakah yakin akan menghapus ini?")) {
                const batch = db.batch();
                
                checkedBoxes.forEach(cb => {
                    const index = parseInt(cb.getAttribute('data-index'));
                    const idDoc = pelangganData[index].idDoc;
                    const docRef = db.collection('pelanggan').doc(idDoc);
                    batch.delete(docRef);
                });
                
                batch.commit().catch((error) => {
                    console.error("Error in bulk delete: ", error);
                    alert("Gagal menghapus data secara massal");
                });
            }
        });

    </script>
</body>
</html>
